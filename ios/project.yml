name: CardsiOS

options:
  bundleIdPrefix: com.jakkuazzo
  deploymentTarget:
    iOS: "17.0"

targets:
  CardsiOS:
    type: application
    platform: iOS
    sources:
      - path: CardsiOS
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakkuazzo.cardsios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.0