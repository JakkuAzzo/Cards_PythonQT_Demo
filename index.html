<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Cards</title>
</head>
<body>
  <main>Loading Cards…</main>
  <script>
    fetch("https://raw.githubusercontent.com/JakkuAzzo/Cards_PythonQT_Demo/xcode/web/index.html", { cache: "no-cache" })
      .then(response => response.ok ? response.text() : Promise.reject(new Error("Preview unavailable")))
      .then(html => { document.open(); document.write(html); document.close(); })
      .catch(() => { document.querySelector("main").textContent = "Cards is temporarily unavailable. Please refresh."; });
  </script>
</body>
</html>
