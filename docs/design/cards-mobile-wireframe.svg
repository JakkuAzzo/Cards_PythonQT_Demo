<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1020" viewBox="0 0 2240 1020">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#080A10"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A9686"/><stop offset="1" stop-color="#35C6AE"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
    <style>
      .phone{fill:#080A10;stroke:#495466;stroke-width:2}.title{font:700 25px -apple-system,BlinkMacSystemFont,sans-serif;fill:#fff}.hero{font:700 42px -apple-system,BlinkMacSystemFont,sans-serif;fill:#fff}.body{font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#BEC6D5}.label{font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:2px;fill:#46DCAA}.button{font:700 14px -apple-system,BlinkMacSystemFont,sans-serif;fill:#081412}.buttonSecondary{font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;fill:#fff}.nav{font:600 10px -apple-system,BlinkMacSystemFont,sans-serif;fill:#BEC6D5}.navOn{font:700 10px -apple-system,BlinkMacSystemFont,sans-serif;fill:#F5B72B}.small{font:500 11px -apple-system,BlinkMacSystemFont,sans-serif;fill:#BEC6D5}.section{font:700 15px -apple-system,BlinkMacSystemFont,sans-serif;fill:#fff}.token{font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;fill:#fff}.tokenValue{font:500 13px ui-monospace,SFMono-Regular,monospace;fill:#BEC6D5}
    </style>
    <style>
      .navDock{fill:#151A23;stroke:#394555;stroke-width:1}.navActive{fill:#2B3745}.navGlyph{font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;fill:#8993A4}.navGlyphOn{font:700 16px -apple-system,BlinkMacSystemFont,sans-serif;fill:#F5B72B}.navLabel{font:700 8px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.4px;fill:#F5B72B}
    </style>
    <g id="premium-nav-base">
      <rect x="0" y="786" width="402" height="88" fill="#080A10"/>
      <rect class="navDock" x="12" y="800" width="378" height="62" rx="25"/>
      <text class="navGlyph" x="50" y="835" text-anchor="middle">⌂</text>
      <text class="navGlyph" x="125" y="835" text-anchor="middle">▣</text>
      <text class="navGlyph" x="200" y="835" text-anchor="middle">♟</text>
      <text class="navGlyph" x="275" y="835" text-anchor="middle">＋</text>
      <text class="navGlyph" x="350" y="835" text-anchor="middle">✦</text>
    </g>
  </defs>
  <rect width="2240" height="1020" fill="#E7EAF0"/>
  <text x="52" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="700" fill="#121921">Cards · native mobile wireframe</text>
  <text x="52" y="87" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" fill="#5B6472">One visual hierarchy for iOS and Android · v1 local-first shell</text>

  <!-- Home · uses the production icon asset from web/assets/icon.svg -->
  <image href="../../web/assets/icon.svg" x="236" y="140" width="34" height="34"/>
  <g transform="translate(52 120)"><rect class="phone" width="402" height="874" rx="36" filter="url(#shadow)"/><text x="201" y="49" text-anchor="middle" class="title">Cards</text><text x="22" y="107" class="label">✦ READY WHEN YOU ARE</text><text x="22" y="158" class="hero">Deal yourself in.</text><text x="22" y="190" class="body">Pick a deck and make the next card the moment.</text><rect x="20" y="222" width="362" height="218" rx="24" fill="url(#teal)"/><text x="40" y="260" class="label" fill="#D4FFF5">CLASSIC</text><text x="40" y="302" class="title">Classic Pack 52</text><text x="40" y="330" class="body" fill="#E8FFFA">The original designed Cards deck:</text><text x="40" y="350" class="body" fill="#E8FFFA">52 cards · offline ready</text><rect x="302" y="246" width="60" height="84" rx="12" fill="#fff"/><text x="316" y="282" font-family="serif" font-size="28" font-weight="700" fill="#121921">A</text><text x="318" y="308" font-size="25">♠</text><rect x="20" y="458" width="362" height="58" rx="18" fill="#F5B72B"/><text x="201" y="494" text-anchor="middle" class="button">▶  Start a solo game</text><rect x="20" y="532" width="176" height="52" rx="18" fill="#272D38"/><text x="108" y="564" text-anchor="middle" class="buttonSecondary">Shuffle</text><rect x="206" y="532" width="176" height="52" rx="18" fill="#272D38"/><text x="294" y="564" text-anchor="middle" class="buttonSecondary">Deck details</text><rect x="20" y="610" width="362" height="150" rx="24" fill="#1F242D"/><text x="40" y="648" class="section">Your table, so far</text><rect x="38" y="670" width="158" height="60" rx="14" fill="#2B313B"/><text x="55" y="695" class="title">0</text><text x="55" y="716" class="small">Sessions</text><rect x="206" y="670" width="158" height="60" rx="14" fill="#2B313B"/><text x="223" y="695" class="title">0</text><text x="223" y="716" class="small">Cards drawn</text><rect x="0" y="790" width="402" height="84" rx="28" fill="#181C25"/><text x="40" y="832" class="navOn">⌂</text><text x="32" y="852" class="navOn">Home</text><text x="113" y="832" class="nav">▣</text><text x="101" y="852" class="nav">Library</text><text x="191" y="832" class="nav">♟</text><text x="174" y="852" class="nav">Table</text><text x="270" y="832" class="nav">✣</text><text x="251" y="852" class="nav">Create</text><text x="349" y="832" class="nav">✦</text><text x="326" y="852" class="nav">Discover</text></g>

  <!-- Library -->
  <g transform="translate(490 120)"><rect class="phone" width="402" height="874" rx="36" filter="url(#shadow)"/><text x="22" y="60" class="hero" font-size="32">Library</text><text x="22" y="88" class="body">Games ready to play offline or with friends.</text><rect x="20" y="120" width="362" height="110" rx="20" fill="#1F242D"/><text x="40" y="156" class="section">Classic Pack Poker</text><text x="40" y="180" class="small">Private hands · shared table · 2–4 players</text><rect x="286" y="148" width="74" height="48" rx="16" fill="#46DCAA"/><text x="323" y="178" text-anchor="middle" class="button">Play</text><rect x="20" y="246" width="362" height="110" rx="20" fill="#1F242D"/><text x="40" y="282" class="section">Guess Who Board</text><text x="40" y="306" class="small">Private target · compact character grid</text><rect x="286" y="274" width="74" height="48" rx="16" fill="#46DCAA"/><text x="323" y="304" text-anchor="middle" class="button">Play</text><rect x="20" y="372" width="362" height="110" rx="20" fill="#1F242D"/><text x="40" y="408" class="section">Double-Six Dominoes</text><text x="40" y="432" class="small">Shared train · private hand · 2–4 players</text><rect x="286" y="400" width="74" height="48" rx="16" fill="#46DCAA"/><text x="323" y="430" text-anchor="middle" class="button">Play</text><text x="22" y="530" class="section">Your created games</text><rect x="20" y="552" width="362" height="92" rx="20" fill="#1B464D"/><text x="40" y="588" class="section">Friday poker night</text><text x="40" y="612" class="small">poker · up to 4 · saved on this device</text><rect x="0" y="790" width="402" height="84" rx="28" fill="#181C25"/><text x="32" y="852" class="navOn">Library</text><text x="32" y="832" class="navOn">▣</text><text x="113" y="832" class="nav">⌂</text><text x="101" y="852" class="nav">Home</text><text x="191" y="832" class="nav">♟</text><text x="174" y="852" class="nav">Table</text><text x="270" y="832" class="nav">✣</text><text x="251" y="852" class="nav">Create</text><text x="349" y="832" class="nav">✦</text><text x="326" y="852" class="nav">Discover</text></g>

  <!-- Table -->
  <g transform="translate(928 120)"><rect class="phone" width="402" height="874" rx="36" filter="url(#shadow)"/><text x="22" y="60" class="hero" font-size="32">Table</text><text x="22" y="88" class="body">Play locally first. Connect only when everyone is ready.</text><rect x="20" y="120" width="362" height="92" rx="20" fill="#1F242D"/><text x="40" y="155" class="section">Play on this phone</text><text x="40" y="181" class="small">Solo and pass-and-play are always available.</text><rect x="20" y="232" width="362" height="56" rx="18" fill="#F5B72B"/><text x="201" y="267" text-anchor="middle" class="button">▶  Open local table</text><text x="22" y="342" class="section">Play together</text><text x="22" y="368" class="small">Nearby and Bluetooth stay secondary until requested.</text><rect x="20" y="388" width="362" height="56" rx="18" fill="#334363"/><text x="201" y="423" text-anchor="middle" class="buttonSecondary">Create nearby table</text><rect x="20" y="456" width="362" height="56" rx="18" fill="#334363"/><text x="201" y="491" text-anchor="middle" class="buttonSecondary">Join with code</text><rect x="20" y="550" width="362" height="110" rx="20" fill="#1F242D"/><text x="40" y="588" class="section">Connection status</text><text x="40" y="618" class="small">Not connected · Bluetooth is checked before hosting.</text><text x="40" y="642" class="small">Leave table always returns here.</text><rect x="0" y="790" width="402" height="84" rx="28" fill="#181C25"/><text x="191" y="832" class="navOn">♟</text><text x="174" y="852" class="navOn">Table</text><text x="32" y="832" class="nav">⌂</text><text x="101" y="852" class="nav">Home</text><text x="113" y="832" class="nav">▣</text><text x="101" y="852" class="nav">Library</text><text x="270" y="832" class="nav">✣</text><text x="251" y="852" class="nav">Create</text><text x="349" y="832" class="nav">✦</text><text x="326" y="852" class="nav">Discover</text></g>

  <!-- Create -->
  <g transform="translate(1366 120)"><rect class="phone" width="402" height="874" rx="36" filter="url(#shadow)"/><text x="22" y="60" class="hero" font-size="32">Create</text><text x="22" y="88" class="body">Choose a tested template. No generated code runs on-device.</text><rect x="20" y="120" width="362" height="256" rx="22" fill="#232C40"/><text x="38" y="155" class="label">GAME IDEA</text><text x="38" y="188" class="body" fill="#fff">idea: four-player poker night</text><text x="38" y="218" class="body" fill="#fff">multiplayer: y</text><text x="38" y="248" class="body" fill="#fff">max_users: 4</text><text x="38" y="278" class="body" fill="#fff">ar: n</text><text x="38" y="308" class="body" fill="#fff">tabledesign: poker_2.png</text><rect x="20" y="398" width="362" height="58" rx="18" fill="#46DCAA"/><text x="201" y="434" text-anchor="middle" class="button">✦  Save validated draft</text><rect x="20" y="486" width="362" height="126" rx="20" fill="#1F242D"/><text x="40" y="522" class="section">Validated preview</text><text x="40" y="550" class="small">Classic Pack Poker · 2–4 players</text><text x="40" y="574" class="small">poker-2 · AR off · offline ready</text><rect x="0" y="790" width="402" height="84" rx="28" fill="#181C25"/><text x="270" y="832" class="navOn">✣</text><text x="251" y="852" class="navOn">Create</text><text x="32" y="832" class="nav">⌂</text><text x="101" y="852" class="nav">Home</text><text x="113" y="832" class="nav">▣</text><text x="101" y="852" class="nav">Library</text><text x="191" y="832" class="nav">♟</text><text x="174" y="852" class="nav">Table</text><text x="349" y="832" class="nav">✦</text><text x="326" y="852" class="nav">Discover</text></g>

  <!-- Discover -->
  <g transform="translate(1804 120)"><rect class="phone" width="402" height="874" rx="36" filter="url(#shadow)"/><text x="22" y="60" class="hero" font-size="32">Discover</text><text x="22" y="88" class="body">Starter games, table styles, and new ways to play.</text><rect x="20" y="120" width="362" height="205" rx="24" fill="url(#teal)"/><text x="40" y="158" class="label" fill="#D4FFF5">NEW BUILT-IN GAME</text><text x="40" y="204" class="title">Double-Six</text><text x="40" y="234" class="title">Dominoes</text><text x="40" y="272" class="small" fill="#E8FFFA">Shared train · private hands · local AI</text><rect x="20" y="350" width="362" height="56" rx="18" fill="#F5B72B"/><text x="201" y="385" text-anchor="middle" class="button">Play Dominoes</text><text x="22" y="466" class="section">Coming next</text><rect x="20" y="488" width="362" height="76" rx="18" fill="#1F242D"/><text x="40" y="522" class="section">Table themes</text><text x="40" y="546" class="small">Green Classic · Guess Grid · Domino Yard</text><rect x="20" y="582" width="362" height="76" rx="18" fill="#1F242D"/><text x="40" y="616" class="section">More game templates</text><text x="40" y="640" class="small">Prompt tables · custom card packs</text><rect x="0" y="790" width="402" height="84" rx="28" fill="#181C25"/><text x="349" y="832" class="navOn">✦</text><text x="326" y="852" class="navOn">Discover</text><text x="32" y="832" class="nav">⌂</text><text x="101" y="852" class="nav">Home</text><text x="113" y="832" class="nav">▣</text><text x="101" y="852" class="nav">Library</text><text x="191" y="832" class="nav">♟</text><text x="174" y="852" class="nav">Table</text><text x="270" y="832" class="nav">✣</text><text x="251" y="852" class="nav">Create</text></g>

  <!-- Premium navigation overlay · one compact dock, active tab only is labelled. -->
  <g transform="translate(52 120)"><use href="#premium-nav-base"/><rect class="navActive" x="19" y="806" width="62" height="50" rx="20"/><text class="navGlyphOn" x="50" y="830" text-anchor="middle">⌂</text><text class="navLabel" x="50" y="846" text-anchor="middle">Home</text></g>
  <g transform="translate(490 120)"><use href="#premium-nav-base"/><rect class="navActive" x="94" y="806" width="62" height="50" rx="20"/><text class="navGlyphOn" x="125" y="830" text-anchor="middle">▣</text><text class="navLabel" x="125" y="846" text-anchor="middle">Library</text></g>
  <g transform="translate(928 120)"><use href="#premium-nav-base"/><rect class="navActive" x="169" y="806" width="62" height="50" rx="20"/><text class="navGlyphOn" x="200" y="830" text-anchor="middle">♟</text><text class="navLabel" x="200" y="846" text-anchor="middle">Table</text></g>
  <g transform="translate(1366 120)"><use href="#premium-nav-base"/><rect class="navActive" x="244" y="806" width="62" height="50" rx="20"/><text class="navGlyphOn" x="275" y="830" text-anchor="middle">＋</text><text class="navLabel" x="275" y="846" text-anchor="middle">Create</text></g>
  <g transform="translate(1804 120)"><use href="#premium-nav-base"/><rect class="navActive" x="319" y="806" width="62" height="50" rx="20"/><text class="navGlyphOn" x="350" y="830" text-anchor="middle">✦</text><text class="navLabel" x="350" y="846" text-anchor="middle">Discover</text></g>

  <g transform="translate(52 1008)"><text class="token" x="0" y="0">TOKENS  ·  canvas #080A10  ·  surface #1F242D  ·  control #334363  ·  mint #46DCAA  ·  gold #F5B72B  ·  radius 24 / 18  ·  spacing 8</text></g>
</svg>
