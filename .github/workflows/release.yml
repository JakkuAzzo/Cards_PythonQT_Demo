name: Build release artifacts

"on":
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"
      - run: yes | sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cards-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: Cards-macOS
            artifact: dist/Cards.app
          - os: windows-latest
            name: Cards-Windows
            artifact: dist/Cards.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name Cards desktop/cards_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}"
          path: "${{ matrix.artifact }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - run: cd release && zip -r ../Cards-Android-debug.apk.zip Cards-Android-debug-apk && zip -r ../Cards-macOS.zip Cards-macOS && zip -r ../Cards-Windows.zip Cards-Windows
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            Cards-Android-debug.apk.zip
            Cards-macOS.zip
            Cards-Windows.zip
