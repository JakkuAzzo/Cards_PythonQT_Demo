name: Build release artifacts

"on":
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Cards-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name Cards desktop/cards_desktop.py
      - run: hdiutil create -volname Cards -srcfolder dist/Cards.app -ov -format UDZO dist/Cards-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Cards-macOS-dmg
          path: dist/Cards-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name Cards desktop/cards_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cards-Windows-exe
          path: dist/Cards/Cards.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cards-Android-debug-apk
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: Cards-macOS-dmg
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: Cards-Windows-exe
          path: release/windows
      - name: Prepare release files
        run: |
          set -euo pipefail
          apk="$(find release/android -type f -name '*.apk' -print -quit)"
          dmg="$(find release/macos -type f -name '*.dmg' -print -quit)"
          exe="$(find release/windows -type f -name 'Cards.exe' -print -quit)"
          test -n "$apk" && test -n "$dmg" && test -n "$exe"
          cp "$apk" Cards-Android-debug.apk
          cp "$dmg" Cards-macOS.dmg
          cp "$exe" Cards-Windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            Cards-Android-debug.apk
            Cards-macOS.dmg
            Cards-Windows.exe
